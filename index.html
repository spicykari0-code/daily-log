<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2f3a">
<title>Daily Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --cream:#e8e4cf;
  --ink:#2b2f3a;
  --ink-soft:#4a4f5e;
  --font-title:'Silkscreen',ui-monospace,monospace;
  --font-body:'VT323',ui-monospace,monospace;
  --dither:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/4px 4px;
  --paper-dots:conic-gradient(rgba(43,47,58,.07) 25%,transparent 0 50%,rgba(43,47,58,.07) 0 75%,transparent 0) 0 0/4px 4px;
  --rule:rgba(43,47,58,.35);
}
*{box-sizing:border-box;}
html{background:var(--ink);}
body{
  margin:0;padding:14px 10px 60px;font-family:var(--font-body);font-size:1.2rem;color:var(--ink);
  background:conic-gradient(rgba(232,228,207,0.07) 25%,transparent 0 50%,rgba(232,228,207,0.07) 0 75%,transparent 0) 0 0/4px 4px,var(--ink);
}
button,input,textarea{font:inherit;}
::selection{background:var(--ink);color:var(--cream);}

/* ---------- boot overlay ---------- */
.boot{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--cream);padding:24px 18px;font-size:1.2rem;line-height:1.45;white-space:pre-wrap;transition:opacity .5s;}
.boot.done{opacity:0;pointer-events:none;}
.boot .cursor{display:inline-block;width:.55em;background:var(--cream);animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

.desktop{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

/* ---------- window ---------- */
.win{background:var(--cream);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--cream),5px 5px 0 3px var(--cream);}
.win > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;user-select:none;}
.win > summary::-webkit-details-marker{display:none;}
.win[open] > summary{border-bottom:3px solid var(--ink);}
.win .title{font-family:var(--font-title);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;flex:none;}
.win .dither{flex:1;height:14px;background:var(--dither);border:2px solid var(--ink);min-width:16px;}
.win .toggle{width:24px;height:24px;border:3px solid var(--ink);flex:none;position:relative;background:var(--cream);}
.win .toggle::after{content:"";position:absolute;left:50%;top:50%;margin:-4px 0 0 -6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink);}
.win[open] .toggle::after{border-top:0;border-bottom:8px solid var(--ink);}
.win .body{padding:10px 10px 12px;display:flex;flex-direction:column;}

/* ---------- dark screens: globe + info ---------- */
.sys-row{display:flex;gap:8px;height:84px;}
.screen{background:var(--ink);border:3px solid var(--ink);position:relative;overflow:hidden;}
.globe{width:84px;flex:none;display:flex;align-items:center;justify-content:center;perspective:260px;}
.g-tilt{width:56px;height:56px;position:relative;transform-style:preserve-3d;transform:rotateX(-18deg);}
.g-spin{width:56px;height:56px;position:relative;transform-style:preserve-3d;animation:gspin 9s linear infinite;}
@keyframes gspin{to{transform:rotateY(360deg);}}
.g-spin .ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(232,228,207,.7);}
.g-spin .ring.eq{border-color:var(--cream);}
.g-spin .lon{width:56px;height:56px;margin:-28px 0 0 -28px;}
.g-spin .l1{transform:rotateY(0deg);}.g-spin .l2{transform:rotateY(30deg);}.g-spin .l3{transform:rotateY(60deg);}
.g-spin .l4{transform:rotateY(90deg);}.g-spin .l5{transform:rotateY(120deg);}.g-spin .l6{transform:rotateY(150deg);}
.g-spin .t1{width:28px;height:28px;margin:-14px 0 0 -14px;transform:rotateX(90deg) translateZ(24.2px);}
.g-spin .t2{width:48.4px;height:48.4px;margin:-24.2px 0 0 -24.2px;transform:rotateX(90deg) translateZ(14px);}
.g-spin .t3{width:56px;height:56px;margin:-28px 0 0 -28px;transform:rotateX(90deg);}
.g-spin .t4{width:48.4px;height:48.4px;margin:-24.2px 0 0 -24.2px;transform:rotateX(90deg) translateZ(-14px);}
.g-spin .t5{width:28px;height:28px;margin:-14px 0 0 -14px;transform:rotateX(90deg) translateZ(-24.2px);}
.info{
  flex:1;min-width:0;padding:6px 10px;display:flex;flex-direction:column;justify-content:space-between;
  color:var(--cream);font-size:1rem;line-height:1.1;letter-spacing:.04em;
  background:repeating-linear-gradient(0deg,rgba(232,228,207,.05) 0,rgba(232,228,207,.05) 1px,transparent 1px,transparent 3px),var(--ink);
}
.irow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ik{opacity:.55;}
.iv{text-align:right;white-space:nowrap;}
.bar{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle;}
.bar i{display:block;width:6px;height:10px;border:1px solid var(--cream);}
.bar i.on{background:var(--cream);}
.live{display:inline-block;width:.5em;height:.8em;background:var(--cream);margin-left:5px;vertical-align:-1px;animation:blink 1s step-end infinite;}

/* date + calendar */
.date-line{position:relative;display:flex;align-items:center;gap:8px;margin-top:8px;font-size:1rem;letter-spacing:.04em;flex-wrap:wrap;}
.date-line .lbl{color:var(--ink-soft);text-transform:uppercase;}
.date-line .val{border:2px solid var(--ink);padding:2px 8px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;background:var(--cream);color:var(--ink);}
.date-line .val:active{transform:translate(2px,2px);box-shadow:none;}
.today-flag{color:var(--ink-soft);margin-left:6px;font-size:.85rem;}
.cal-popup{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:250px;background:var(--cream);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px;}
.cal-popup.open{display:block;}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.cal-nav{width:26px;height:26px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;padding:0;line-height:1;font-size:1.2rem;}
.cal-nav:active{transform:translate(2px,2px);box-shadow:none;}
.cal-title{font-family:var(--font-title);font-size:.7rem;letter-spacing:.08em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{text-align:center;font-size:.85rem;color:var(--ink-soft);}
.cal-day{height:28px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer;padding:0;font-size:1.05rem;}
.cal-day.other-month{border-color:transparent;background:none;cursor:default;}
.cal-day.today{border-style:dashed;}
.cal-day.selected{background:var(--ink);color:var(--cream);}
.cal-day.disabled{opacity:.3;cursor:default;}

/* ---------- field row: label + scale/stepper ---------- */
.field{padding:8px 0;border-bottom:2px dashed var(--rule);display:flex;flex-direction:column;gap:6px;}
.field:first-child{padding-top:0;}
.field:last-child{border-bottom:0;padding-bottom:0;}
.f-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;}
.f-label{font-family:var(--font-title);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;}
.k{font-size:.95rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.sep{border-top:2px dashed var(--rule);}

.scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px 5px;}
.scale .cap{font-size:.74rem;line-height:1;letter-spacing:0;text-transform:uppercase;color:var(--ink-soft);text-align:center;white-space:nowrap;}
.scale .b{position:relative;display:block;min-width:0;}
.scale .b input{position:absolute;opacity:0;pointer-events:none;}
.scale .b span{display:block;height:30px;line-height:25px;text-align:center;border:2px solid var(--ink);background:var(--cream);box-shadow:2px 2px 0 var(--ink);font-size:1.15rem;cursor:pointer;transition:transform .06s,box-shadow .06s;}
.scale .b span:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.scale .b input:checked + span{background:var(--ink);color:var(--cream);}
.scale .b input:focus-visible + span{outline:3px dashed var(--ink);outline-offset:2px;}

.scale.off{opacity:.35;}
.offtog{position:relative;display:inline-block;}
.offtog input{position:absolute;opacity:0;pointer-events:none;}
.offtog span{display:block;padding:2px 9px;border:2px solid var(--ink);background:var(--cream);box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;line-height:1.1;cursor:pointer;}
.offtog span:active{transform:translate(2px,2px);box-shadow:none;}
.offtog input:checked + span{background:var(--ink);color:var(--cream);}
.offtog input:focus-visible + span{outline:3px dashed var(--ink);outline-offset:2px;}

/* ---------- steppers + inputs ---------- */
.stepper{display:inline-flex;align-items:center;gap:6px;}
.stepper button{width:26px;height:26px;border:2px solid var(--ink);background:var(--cream);box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-size:1.2rem;line-height:1;padding:0;color:var(--ink);}
.stepper button:active{transform:translate(2px,2px);box-shadow:none;}
.stepper .v{
  width:5.2ch;min-width:0;text-align:center;font-family:var(--font-body);font-size:1.15rem;color:var(--ink);
  border:0;border-bottom:2px dashed var(--ink-soft);border-radius:0;background:transparent;padding:1px 0;
}
.stepper .v.hm{width:9.4ch;}
.stepper .v:focus{outline:none;border-bottom-style:solid;background:var(--paper-dots);}
.stepper .u{font-size:.85rem;color:var(--ink-soft);text-transform:uppercase;}
.num,.txt,textarea{font-family:var(--font-body);font-size:1.1rem;color:var(--ink);border:2px solid var(--ink);border-radius:0;background:var(--paper-dots),var(--cream);padding:3px 7px;}
.num{width:7.5ch;text-align:center;}
.txt{width:100%;}
textarea{display:block;width:100%;resize:vertical;min-height:44px;padding:5px 8px;}
.num::placeholder,.txt::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.7;}
.num:focus,.txt:focus,textarea:focus{outline:3px dashed var(--ink);outline-offset:2px;}

/* ---------- "+" habit row ---------- */
.habit{border-bottom:2px dashed var(--rule);}
.habit:last-child{border-bottom:0;}
.habit > input{position:absolute;opacity:0;pointer-events:none;}
.hrow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;user-select:none;}
.plus{width:26px;height:26px;border:3px solid var(--ink);background:var(--cream);box-shadow:2px 2px 0 var(--ink);position:relative;flex:none;transition:background .1s;}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--ink);transition:background .1s,transform .15s;}
.plus::before{width:12px;height:3px;margin:-1.5px 0 0 -6px;}
.plus::after{width:3px;height:12px;margin:-6px 0 0 -1.5px;}
.hname{font-family:var(--font-title);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;flex:1;}
.hsum{font-size:1.05rem;color:var(--ink-soft);text-transform:uppercase;}
.habit > input:checked + .hrow .plus{background:var(--ink);}
.habit > input:checked + .hrow .plus::before,.habit > input:checked + .hrow .plus::after{background:var(--cream);transform:rotate(45deg);}
.habit > input:checked + .hrow .hsum{color:var(--ink);}
.habit > input:focus-visible + .hrow .plus{outline:3px dashed var(--ink);outline-offset:2px;}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;}
.panel > div{overflow:hidden;min-height:0;}
.habit > input:checked ~ .panel{grid-template-rows:1fr;}
.panel .inner{margin:0 0 9px 36px;padding:8px 10px;border:2px solid var(--ink);background:var(--paper-dots);display:flex;flex-direction:column;gap:9px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;}

/* column lists (books, exercise, medication) */
.list{display:flex;flex-direction:column;}
.li{position:relative;border-bottom:2px dashed rgba(43,47,58,.25);}
.li:last-child{border-bottom:0;}
.li > input{position:absolute;opacity:0;pointer-events:none;}
.li > label{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;padding-right:30px;}
.cb{width:18px;height:18px;border:2px solid var(--ink);background:var(--cream);box-shadow:2px 2px 0 var(--ink);position:relative;flex:none;}
.li > input:checked + label .cb{background:var(--ink);}
.li > input:checked + label .cb::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--cream);border-width:0 2px 2px 0;transform:rotate(45deg);}
.li > input:focus-visible + label .cb{outline:3px dashed var(--ink);outline-offset:2px;}
.li .det{display:none;flex-direction:column;gap:6px;padding:2px 0 9px 27px;}
.li > input:checked ~ .det{display:flex;}
.rm{display:none;position:absolute;top:4px;right:0;width:24px;height:24px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer;padding:0;line-height:1;font-size:1.1rem;}
.editing .rm{display:block;}
.addrow{display:flex;gap:16px;margin-top:6px;justify-content:flex-end;}
.addbtn{padding:2px 0;border:0;background:none;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-size:.9rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;opacity:.85;}
.addbtn:active,.addbtn:hover{color:var(--ink);opacity:1;}

/* photos */
.photos{display:flex;gap:8px;}
.slot{position:relative;width:62px;height:62px;border:2px dashed var(--ink);display:grid;place-items:center;font-size:1.8rem;cursor:pointer;background:var(--paper-dots);overflow:hidden;}
.slot:has(img){border-style:solid;}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.slot .rm{display:block;top:0;right:0;width:20px;height:20px;font-size:.95rem;}
.slot:active{background:var(--ink);color:var(--cream);}

/* settings + save */
.settings-body{display:flex;flex-direction:column;gap:8px;}
.hint{font-size:.95rem;color:var(--ink-soft);}
.save-bar{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.btn{font-family:var(--font-title);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
.btn.primary{width:100%;padding:15px 18px;font-size:.85rem;background:var(--cream);color:var(--ink);border-color:var(--cream);box-shadow:5px 5px 0 rgba(232,228,207,.35);}
.btn.primary:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--cream);}
.save-bar{align-items:stretch;}
.save-status{margin:0;min-height:1.2em;color:var(--cream);font-size:1.05rem;letter-spacing:.03em;}
.save-status.err{background:var(--cream);color:var(--ink);padding:3px 8px;}

@media (prefers-reduced-motion:reduce){.g-spin,.live,.boot .cursor{animation:none;}.panel{transition:none;}}
</style>
</head>
<body>

<div class="boot" id="boot"><span id="bootText"></span><span class="cursor">&nbsp;</span></div>

<div class="desktop" id="desktop">

  <details class="win" open>
    <summary><span class="title">Daily Log</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body">
      <div class="sys-row">
        <div class="screen globe" aria-hidden="true">
          <div class="g-tilt"><div class="g-spin">
            <span class="ring lon l1"></span><span class="ring lon l2"></span><span class="ring lon l3"></span>
            <span class="ring lon l4"></span><span class="ring lon l5"></span><span class="ring lon l6"></span>
            <span class="ring t1"></span><span class="ring t2"></span><span class="ring eq t3"></span><span class="ring t4"></span><span class="ring t5"></span>
          </div></div>
        </div>
        <div class="screen info" aria-live="polite">
          <div class="irow"><span class="ik">DATE</span><span class="iv" id="iDate"></span></div>
          <div class="irow"><span class="ik">MONTH</span><span class="iv" id="iMonth"></span></div>
          <div class="irow"><span class="ik">LOGGED</span><span class="iv"><span id="iLog"></span><span class="bar" id="iBar"></span></span></div>
          <div class="irow"><span class="ik">STATUS</span><span class="iv"><span id="iStatus"></span><span class="live"></span></span></div>
        </div>
      </div>
      <div class="date-line">
        <span class="lbl">&gt; Log date:</span>
        <span class="val" id="dateDisplay" tabindex="0" role="button"></span>
        <div class="cal-popup" id="calPopup">
          <div class="cal-head">
            <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">&lsaquo;</button>
            <span class="cal-title" id="calTitle"></span>
            <button type="button" class="cal-nav" id="calNext" aria-label="Next month">&rsaquo;</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>
    </div>
  </details>

  <details class="win" open id="winCheck">
    <summary><span class="title">Checkpoints</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body" id="bodyCheck"></div>
  </details>

  <details class="win" open id="winDaily">
    <summary><span class="title">Daily</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body" id="bodyDaily"></div>
  </details>

  <details class="win" open id="winHabits">
    <summary><span class="title">Habits</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body" id="bodyHabits"></div>
  </details>

  <details class="win" id="winSubs">
    <summary><span class="title">Substances &amp; Screen</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body" id="bodySubs"></div>
  </details>

  <details class="win" id="winMemory">
    <summary><span class="title">Memory</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body" id="bodyMemory"></div>
  </details>

  <details class="win" id="winSettings">
    <summary><span class="title">Settings</span><span class="dither"></span><span class="toggle"></span></summary>
    <div class="body settings-body">
      <label class="k" for="webAppUrl">&gt; Apps Script web app URL</label>
      <input class="txt" type="text" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="hint">Paste the link you get after deploying the script. Saved only in this browser.</p>
      <div><button class="btn" id="saveUrlBtn" type="button">Save URL</button></div>
    </div>
  </details>

  <div class="save-bar">
    <button class="btn primary" id="saveBtn" type="button">Save entry</button>
    <p class="save-status" id="saveStatus"></p>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  var pad = function(n){ return String(n).padStart(2, "0"); };
  function $(s, r){ return (r || document).querySelector(s); }
  function $$(s, r){ return [].slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function parseHm(str){
    var s = String(str).trim().toLowerCase().replace(",", ".").replace(/\s+/g, " "), m;
    if (!s) return 0;
    if ((m = s.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + Math.min(+m[2], 59);
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*(?:h|г|год)\.?\s*(?:(\d+)\s*(?:m|min|хв)?\.?)?$/))) return Math.round(+m[1] * 60 + (m[2] ? +m[2] : 0));
    if ((m = s.match(/^(\d+)\s*(?:m|min|хв)\.?$/))) return +m[1];
    if (/^\d+(?:\.\d+)?$/.test(s)){
      var n = parseFloat(s);
      if (s.indexOf(".") > -1) return Math.round(n * 60);
      return n <= 24 ? n * 60 : n;
    }
    return null;
  }
  function fmtMin(v){
    var h = Math.floor(v / 60), m = Math.round(v % 60);
    return h ? (m ? h + " h " + m + " min" : h + " h") : m + " min";
  }

  /* ---------- active date ---------- */
  var realToday = new Date();
  var realTodayStr = realToday.getFullYear() + "-" + pad(realToday.getMonth() + 1) + "-" + pad(realToday.getDate());
  function dateFromUrl(){
    try { var m = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})(?:&|$)/); if (m) return m[1]; } catch(e){}
    return null;
  }
  var activeDateStr = dateFromUrl() || realTodayStr;
  var activeDate = new Date(activeDateStr + "T00:00:00");
  var DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var activeDisplay = pad(activeDate.getDate()) + "." + pad(activeDate.getMonth() + 1) + "." + activeDate.getFullYear();

  var KEY = "dailylog2_" + activeDateStr;
  var SAVED_KEY = "dailylog2_saved_" + activeDateStr;
  var URL_KEY = "dailylog_weburl";
  var LISTS_KEY = "dailylog_customlists";

  /* ---------- boot overlay ---------- */
  (function(){
    var boot = $("#boot"), textEl = $("#bootText"), done = false;

  function stepper(id, step, unit, type, first){
    var s = el("span", "stepper");
    s._s = { step: step, val: 0, unit: unit || "", type: type || "", first: first || step };
    var minus = el("button", null, "-"); minus.type = "button"; minus.setAttribute("aria-label", "decrease");
    var v = el("input", "v" + (type === "hm" ? " hm" : "")), u = el("span", "u");
    v.type = "text"; v.setAttribute("autocomplete", "off");
    v.inputMode = type === "hm" ? "text" : "decimal";
    v.setAttribute("aria-label", "value" + (unit ? " (" + unit + ")" : ""));
    var plus = el("button", null, "+"); plus.type = "button"; plus.setAttribute("aria-label", "increase");
    s.appendChild(minus); s.appendChild(v); s.appendChild(u); s.appendChild(plus);
    s._show = function(){
      v.value = s._s.type === "hm" ? fmtMin(s._s.val) : s._s.val;
      u.textContent = s._s.type === "hm" ? "" : s._s.unit;
    };
    v.addEventListener("focus", function(){
      if (s._s.type === "hm") v.value = Math.floor(s._s.val / 60) + ":" + pad(Math.round(s._s.val % 60));
      setTimeout(function(){ try { v.select(); } catch(e){} }, 0);
    });
    function commit(){
      var n = s._s.type === "hm" ? parseHm(v.value) : parseFloat(String(v.value).replace(",", "."));
      if (n === null || isNaN(n)){ s._show(); return; }
      s._s.val = Math.max(0, Math.round(n * 100) / 100);
      s._show(); changed();
    }
    v.addEventListener("blur", commit);
    v.addEventListener("keydown", function(ev){ if (ev.key === "Enter"){ ev.preventDefault(); v.blur(); } });
    function bump(d){
      var x = s._s;
      if (d > 0 && x.val === 0) x.val = x.first;
      else x.val = Math.max(0, Math.round((x.val + x.step * d) * 100) / 100);
      s._show(); changed();
    }
    minus.addEventListener("click", function(){ bump(-1); });
    plus.addEventListener("click", function(){ bump(1); });
    s._show();
    if (id) STEPS[id] = s;
    return s;
  }

  var PHOTOS = [null, null, null];
  function shrink(file, cb){
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var k = Math.min(1, 1280 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = function(){ cb(r.result); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
  function pickPhoto(i){
    var inp = el("input"); inp.type = "file"; inp.accept = "image/*";

        renderPhotos(); changed();
      });
    });
    inp.click();
  }

    if (PHOTOS.some(function(p){ return !!p; })) n++;
    if (d.memory.trim()) n++;
    [d.meditation, d.supps, d.cigs, d.coffee, d.exercise, d.reading, d.substances, d.dream].forEach(function(h){ if (h.on) n++; });
    return n;
  }
  var TOTAL = 19, dirty = false;
  function refresh(){
    HABITS.forEach(function(h){ h.hs.textContent = h.cb.checked ? h.sum() : "—"; });
    var n = loggedCount(collect());
    iLog.textContent = n + "/" + TOTAL;
    var on = Math.round(n / TOTAL * 10);
    $$("i", iBar).forEach(function(i, k){ i.classList.toggle("on", k < on); });
    var savedAt = lsGet(SAVED_KEY);
    iStatus.textContent = dirty ? "UNSAVED" : (savedAt ? "SAVED " + savedAt : (n ? "UNSAVED" : "NEW ENTRY"));
  }

  var timer = null;
  function changed(){
    if (restoring) return;
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(function(){ lsSet(KEY, JSON.stringify(snapshot())); }, 150);
    refresh();
  }
  document.addEventListener("change", changed);
  document.addEventListener("input", changed);

  // restore saved state for this date
  (function(){
    var raw = lsGet(KEY);
    if (raw){ try { restore(JSON.parse(raw)); } catch(e){} }
  })();
  restoring = false;
  refresh();

  /* ---------- date + calendar ---------- */
  var dateDisplay = $("#dateDisplay"), calPopup = $("#calPopup"), calTitle = $("#calTitle"), calGrid = $("#calGrid");
  dateDisplay.textContent = activeDisplay;
  if (activeDateStr === realTodayStr){ var flag = el("span", "today-flag", "(TODAY)"); dateDisplay.appendChild(flag); }
  var calView = new Date(activeDateStr + "T00:00:00");
  var DOWC = ["MO","TU","WE","TH","FR","SA","SU"];
  function renderCal(){
    var y = calView.getFullYear(), m = calView.getMonth();
    calTitle.textContent = MON[m] + " " + y;
    calGrid.innerHTML = "";
    DOWC.forEach(function(dn){ calGrid.appendChild(el("div", "cal-dow", dn)); });
    var offset = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < offset; i++) calGrid.appendChild(el("span", "cal-day other-month"));
    for (var d = 1; d <= dim; d++){
      var iso = y + "-" + pad(m + 1) + "-" + pad(d);
      var btn = el("button", "cal-day", String(d)); btn.type = "button"; btn.setAttribute("data-iso", iso);
      if (iso === realTodayStr) btn.classList.add("today");
      if (iso === activeDateStr) btn.classList.add("selected");
      if (iso > realTodayStr) btn.classList.add("disabled");
      calGrid.appendChild(btn);
    }
  }
  function openCal(){ calView = new Date(activeDateStr + "T00:00:00"); renderCal(); calPopup.classList.add("open"); }
  function closeCal(){ calPopup.classList.remove("open"); }
  dateDisplay.addEventListener("click", function(){ if (calPopup.classList.contains("open")) closeCal(); else openCal(); });
  dateDisplay.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openCal(); } });
  $("#calPrev").addEventListener("click", function(){ calView.setDate(1); calView.setMonth(calView.getMonth() - 1); renderCal(); });
  $("#calNext").addEventListener("click", function(){ calView.setDate(1); calView.setMonth(calView.getMonth() + 1); renderCal(); });
  calGrid.addEventListener("click", function(ev){
    var btn = ev.target.closest(".cal-day");
    if (!btn || btn.classList.contains("disabled") || btn.classList.contains("other-month")) return;
    var iso = btn.getAttribute("data-iso");
    var params = new URLSearchParams(location.search);
    if (iso === realTodayStr) params.delete("date"); else params.set("date", iso);
    var qs = params.toString();
    location.href = location.pathname + (qs ? "?" + qs : "");
  });
  document.addEventListener("click", function(ev){
    if (!calPopup.contains(ev.target) && ev.target !== dateDisplay && !dateDisplay.contains(ev.target)) closeCal();
  });

  /* ---------- settings ---------- */
  var urlInput = $("#webAppUrl"), saveStatus = $("#saveStatus");
  urlInput.value = lsGet(URL_KEY) || "";
  if (!urlInput.value) $("#winSettings").open = true;
  function setStatus(text, isErr){ saveStatus.textContent = text; saveStatus.classList.toggle("err", !!isErr); }
  $("#saveUrlBtn").addEventListener("click", function(){
    lsSet(URL_KEY, urlInput.value.trim());
    $("#winSettings").open = false;
    setStatus("URL saved.", false);
  });

  /* ---------- save to Google Sheet ---------- */
  $("#saveBtn").addEventListener("click", function(){
    var webAppUrl = lsGet(URL_KEY) || "";
    if (!webAppUrl){
      $("#winSettings").open = true;
      setStatus("Add your web app URL in settings first.", true);
      return;
    }
    var payload = collect();
    var checkUrl = webAppUrl + (webAppUrl.indexOf("?") === -1 ? "?" : "&") + "date=" + encodeURIComponent(activeDateStr);
    function send(){
      setStatus("Saving...", false);
      fetch(webAppUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) }).then(function(){
        PHOTOS.forEach(function(p){ if (p) p.sent = true; });
        var t = new Date();
        var hhmm = pad(t.getHours()) + ":" + pad(t.getMinutes());
        lsSet(SAVED_KEY, hhmm); lsSet(KEY, JSON.stringify(snapshot()));
        dirty = false; refresh();
        var monthTab = activeDateStr.slice(0, 7), dayCol = parseInt(activeDateStr.slice(8), 10);
        setStatus("Sent at " + hhmm + ". Checking the sheet...", false);
        setTimeout(function(){
          fetch(checkUrl).then(function(r){ return r.json(); }).then(function(res){
            if (res && res.exists) setStatus("Saved to tab " + monthTab + ", day " + dayCol + " (" + hhmm + ").", false);
            else if (loggedCount(payload) > 0) setStatus("Sent, but the sheet shows no data for this day. The script may need a new deployment.", true);
            else setStatus("Saved an empty entry at " + hhmm + ".", false);
          }).catch(function(){ setStatus("Sent at " + hhmm + ", but the sheet could not be checked.", false); });
        }, 1200);
      }).catch(function(){
        setStatus("Could not send. Check your connection and the web app URL.", true);
      });
    }
    setStatus("Checking existing data...", false);
    var checkUrl = webAppUrl + (webAppUrl.indexOf("?") === -1 ? "?" : "&") + "date=" + encodeURIComponent(activeDateStr);
    fetch(checkUrl).then(function(r){ return r.json(); }).then(function(res){
      if (res && res.exists){
        if (window.confirm("There is already a saved entry for " + activeDisplay + ". Overwrite it?")) send();
        else setStatus("Cancelled.", false);
      } else send();
    }).catch(function(){ send(); });
  });

})();
</script>
</body>
</html>
